<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300">
  <!-- Circle arc: center (210,148) radius 125 -->
  <!-- Gap on left: upper (97,95) to lower (97,201) -->
  <path d="M 97,201 A 125,125 0 1 1 97,95"
        fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.75"/>

  <!-- Brushstroke sweep at bottom -->
  <path d="M 97,201 Q 155,248 232,245 Q 295,242 362,226"
        fill="none" stroke="white" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
  <path d="M 101,207 Q 158,252 234,249 Q 296,246 358,230"
        fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.22"/>

  <!-- Plant stem -->
  <line x1="152" y1="224" x2="152" y2="92"
        stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.72"/>

  <!-- Left leaf: broad, pointing upper-left, cubic bezier for wide belly -->
  <path d="M 152,136 C 138,118 84,92 90,66 C 108,82 132,112 152,130 Z"
        fill="white" opacity="0.75"/>
  <!-- Left leaf vein -->
  <path d="M 152,136 C 122,112 96,86 91,68" fill="none" stroke="white" stroke-width="1.3" opacity="0.3"/>

  <!-- Right leaf: broad, pointing upper-right -->
  <path d="M 152,118 C 165,100 186,78 175,62 C 168,78 158,96 152,113 Z"
        fill="white" opacity="0.78"/>
  <!-- Right leaf vein -->
  <path d="M 152,118 C 163,102 182,80 174,64" fill="none" stroke="white" stroke-width="1.1" opacity="0.28"/>

  <!-- Small top leaf -->
  <path d="M 152,103 C 144,84 130,68 136,56 C 140,68 148,84 152,98 Z"
        fill="white" opacity="0.68"/>

  <!-- Root curves -->
  <path d="M 152,224 Q 134,235 112,228" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 152,224 Q 168,235 188,229" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Text: ThriveEarth -->
  <text x="140" y="210"
        font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
        font-weight="900" font-size="45" fill="white" opacity="0.85">ThriveEarth</text>

  <!-- HYDROSEEDING — -->
  <text x="141" y="231"
        font-family="Arial, sans-serif" font-weight="600" font-size="13.5"
        fill="white" opacity="0.48" letter-spacing="2.5">HYDROSEEDING —</text>
</svg>
